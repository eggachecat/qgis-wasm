# nginx in front of serve.mjs (installed by scripts/deploy.sh; placeholders filled in there).
# Everything is proxied: serve.mjs already sends COOP/COEP, ETag revalidation, the pre-compressed .br/.gz sidecars,
# Range responses, the MCP endpoint, the agent SSE channel and the (allowlisted) CORS proxy. nginx only terminates TLS —
# SharedArrayBuffer, and therefore QGIS' threads, exist only on a secure origin.
__TLS_REDIRECT__
server {
    __LISTEN__
    server_name __SERVER_NAME__;
    __TLS__

    # the bundle is pre-compressed; never re-encode what serve.mjs sends
    gzip off;
    proxy_buffering off;              # SSE (/agent/events) and large downloads stream through
    proxy_request_buffering off;      # uploads to object storage through /proxy
    client_max_body_size 1g;
    proxy_read_timeout 1h;            # idle SSE channels, long MCP tool calls
    proxy_send_timeout 1h;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
